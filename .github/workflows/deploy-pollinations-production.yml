name: Deploy / Pollinations production

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY == 'true'
    uses: pollinations/pollinations/.github/workflows/deploy-pollinations-site.yml@154eec6262d09d1c034c1984caa4503fd3baca75
    with:
      site-name: catgpt
    secrets:
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
