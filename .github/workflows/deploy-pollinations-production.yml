name: Deploy / Pollinations production

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY == 'true'
    uses: pollinations/pollinations/.github/workflows/deploy-pollinations-site.yml@75c8b4c4c409ce6537b8fb73c054c0155617a7f9
    with:
      site-name: catgpt
    secrets:
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
